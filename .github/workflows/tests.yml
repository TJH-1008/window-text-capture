name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unittest:
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: 版本信息
        run: |
          python -c "import sys, tkinter; print(sys.version)"
          $PSVersionTable.PSVersion

      - name: PowerShell build syntax
        run: |
          $tokens = $null
          $parseErrors = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path build.ps1).Path, [ref]$tokens, [ref]$parseErrors)
          if ($parseErrors.Count -gt 0) { throw ($parseErrors | Out-String) }

      - name: 单元测试
        run: python -m unittest discover -p "test_*.py" -v

      - name: 发布前自查（数据残留、绝对路径、版本号、图标）
        run: python tools/check_release.py --strict
